version: '3.8'

services:
  # 1. Il Database MySQL
  db:
    image: mysql:8.0
    container_name: finance_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret_root_password
      MYSQL_DATABASE: finance_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql  # ← crea le tabelle

  # 2. Il sistema di Cache Redis
  cache:
    image: redis:7-alpine
    container_name: finance_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Il Backend Node.js
  backend:
    build: ./backend
    container_name: finance_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=secret_root_password
      - DB_NAME=finance_db                       # ← stesso nome di MYSQL_DATABASE
      - REDIS_URL=redis://cache:6379
      - JWT_SECRET=super_segreto_jwt_produzione
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db
      - cache

  # 4. Il Frontend React/Nginx
  frontend:
    build: ./frontend
    container_name: finance_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: